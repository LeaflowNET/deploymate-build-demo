name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: npm --prefix web ci --no-audit --no-fund
      - run: make check
      - run: docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" -t taskmate:test .
      - run: python3 scripts/smoke.py taskmate:test
