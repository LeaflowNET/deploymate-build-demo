services:
  demo:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    ports:
      - "127.0.0.1:${DEMO_PORT:-18080}:8080"
    environment:
      DEMO_MESSAGE: ${DEMO_MESSAGE:-Your next idea starts here.}
    volumes:
      - tasks_data:/data
    restart: unless-stopped
volumes:
  tasks_data:
